name: CI

on:
  push:
    branches: [main, 'feat/whatsapp-community-roles']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test main bot
        run: |
          npm install
          npm test
      - name: Test WhatsApp bridge
        working-directory: whatsapp-service
        run: |
          npm install
          npm test
